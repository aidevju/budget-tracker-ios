<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ledger — Budget Tracker</title>

<!-- PWA / iOS home screen setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20262c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Month screen: month-specific summary and transactions -->
  <div id="monthScreen">

    <!-- Month switcher -->
    <header class="month-bar">
      <button class="icon-btn" id="prevMonth" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h1 id="monthLabel">August 2026</h1>
      <button class="icon-btn" id="nextMonth" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </header>

    <!-- Receipt-style balance summary (signature element) -->
    <section class="receipt" id="receipt">
      <div class="receipt-row receipt-total">
        <span>Balance</span>
        <span id="balanceAmount" class="mono">$0.00</span>
      </div>
      <div class="receipt-dashes"></div>
      <div class="receipt-row">
        <span>Income</span>
        <span id="incomeAmount" class="mono income-text">$0.00</span>
      </div>
      <div class="receipt-row">
        <span>Expenses</span>
        <span id="expenseAmount" class="mono expense-text">$0.00</span>
      </div>
    </section>

    <!-- Monthly expense target progress -->
    <div class="target-card" id="targetCard" hidden>
      <div class="target-header">
        <span class="target-label">Monthly target</span>
        <span class="target-percent mono" id="targetPercent">0%</span>
      </div>
      <div class="target-bar-track">
        <div class="target-bar-fill" id="targetBarFill"></div>
      </div>
      <div class="target-status" id="targetStatus"></div>
    </div>

    <!-- Category breakdown -->
    <section class="breakdown" id="breakdown" hidden>
      <h2>By category</h2>
      <div id="breakdownList" class="breakdown-list"></div>
    </section>

    <!-- Transactions list -->
    <section class="transactions">
      <div class="list-header-row">
        <h2>Transactions</h2>
        <button type="button" class="link-btn" id="exportBtn">Export CSV</button>
      </div>
      <div id="txList" class="tx-list">
        <p class="empty-state" id="emptyState">No transactions yet this month. Tap + to add your first one.</p>
      </div>
    </section>

  </div>

  <!-- Dashboard screen: top category, average spend, spending trend -->
  <div id="dashboardScreen" hidden>
    <h1 class="screen-title">Dashboard</h1>

    <div class="insight-row" id="insightRow"></div>

    <div class="pie-card" id="pieCard" hidden>
      <span class="pie-label" id="pieLabel">Spending by category</span>
      <div class="pie-body">
        <svg class="pie-svg" viewBox="0 0 100 100" aria-hidden="true">
          <g id="pieSlices"></g>
        </svg>
        <div class="pie-legend" id="pieLegend"></div>
      </div>
    </div>

    <div class="trend-card" id="trendCard" hidden>
      <div class="trend-label-row">
        <span class="trend-label">Last 6 months</span>
        <button type="button" class="link-btn" id="goToTodayBtn">Today</button>
      </div>
      <div class="trend-bars" id="trendBars"></div>
    </div>

    <p class="empty-state" id="dashboardEmpty" hidden>Add some transactions to see insights here.</p>
  </div>

  <!-- Settings screen -->
  <div id="settingsScreen" hidden>
    <h1 class="screen-title">Settings</h1>

    <div class="settings-group">
      <span class="settings-label">Theme</span>
      <div class="type-toggle" id="themeToggle">
        <button type="button" class="type-btn" data-theme="light">Light</button>
        <button type="button" class="type-btn" data-theme="dark">Dark</button>
        <button type="button" class="type-btn" data-theme="system">System</button>
      </div>
    </div>

    <label class="field">
      <span>Currency</span>
      <select id="currencySelect"></select>
    </label>

    <label class="field">
      <span>Monthly expense target (optional)</span>
      <input type="number" id="targetInput" inputmode="decimal" step="0.01" min="0" placeholder="No target set">
    </label>
  </div>

</div>

<!-- Bottom chrome: floating add button + tab bar -->
<div class="bottom-chrome">
  <button class="fab" id="addBtn" aria-label="Add transaction">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="tabbar">
    <button type="button" class="tab active" data-screen="month" aria-label="Month">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V19a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1V9.5"/></svg></span>
      <span class="lb">Month</span>
    </button>
    <button type="button" class="tab" data-screen="dashboard" aria-label="Dashboard">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11"/><path d="M12 19V5"/><path d="M19 19v-6"/></svg></span>
      <span class="lb">Dashboard</span>
    </button>
    <button type="button" class="tab" data-screen="settings" aria-label="Settings">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.1" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2.1" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="11" cy="17" r="2.1" fill="currentColor" stroke="none"/></svg></span>
      <span class="lb">Settings</span>
    </button>
  </nav>
</div>

<!-- Add / edit transaction sheet -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">Add transaction</h2>

    <div class="type-toggle" id="typeToggle">
      <button type="button" class="type-btn active" data-type="expense">Expense</button>
      <button type="button" class="type-btn" data-type="income">Income</button>
    </div>

    <form id="txForm">
      <label class="field">
        <span>Amount</span>
        <input type="number" id="amountInput" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
      </label>

      <label class="field">
        <span>Category</span>
        <select id="categoryInput" required></select>
      </label>

      <label class="field">
        <span>Note (optional)</span>
        <input type="text" id="noteInput" placeholder="What was it for?" maxlength="60">
      </label>

      <label class="field">
        <span>Date</span>
        <input type="date" id="dateInput" required>
      </label>

      <p class="form-error" id="formError" hidden></p>

      <div class="sheet-actions">
        <button type="button" class="btn-text" id="deleteBtn" hidden>Delete</button>
        <div class="sheet-actions-right">
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
